<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="1200" height="440" rx="16" fill="#FAF9F6"/>
  <text x="64" y="84" font-size="30" font-weight="600" fill="#16171B">4 Noto CJK fonts, 20 pages of a real site</text>
  <text x="64" y="118" font-size="18" fill="#6b6d75">Noto Sans SC 400 / 500 · Noto Serif SC 300 / 400 · measured on rumu3fen.com</text>
  <g font-size="17" fill="#16171B">
    <text x="64" y="186">Source fonts</text>
    <rect x="300" y="166" width="836" height="28" rx="4" fill="#c9c7c0"/>
    <text x="1136" y="224" text-anchor="end" font-size="22" font-weight="600">82.0 MB</text>

    <text x="64" y="282">After cjk-font-trim</text>
    <rect x="300" y="262" width="9" height="28" rx="3" fill="#2B3BFF"/>
    <text x="324" y="283" font-size="22" font-weight="600">818 KB</text>
    <text x="420" y="283" fill="#6b6d75">every character the 20 pages show, per family and weight</text>

    <text x="64" y="358">Loaded first</text>
    <rect x="300" y="338" width="3" height="28" rx="1.5" fill="#2B3BFF"/>
    <text x="324" y="359" font-size="22" font-weight="600">62 KB</text>
    <text x="408" y="359" fill="#6b6d75">first-screen characters of the homepage, preloaded</text>
  </g>
  <text x="64" y="410" font-size="14" fill="#9a9ca3">Bars to scale (the 62 KB bar is widened to stay visible). One run: 22 s on a laptop.</text>
</svg>
