<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cjk-font-trim example</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  body { margin: 0; background: #FAF9F6; color: #16171B; font: 17px/1.9 "LXGW WenKai", "PingFang SC", "Microsoft YaHei", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 28px; }
  .kicker { color: #2B3BFF; font-size: 14px; letter-spacing: .2em; }
  h1 { font: 500 46px/1.3 "LXGW WenKai", "Songti SC", SimSun, serif; margin: 12px 0 20px; letter-spacing: .04em; }
  p { margin: 0 0 1em; color: #3a3c44; }
</style>
</head>
<body>
<main>
  <div class="kicker">兰亭集序 · 王羲之</div>
  <h1>群贤毕至，少长咸集。</h1>
  <p>永和九年，岁在癸丑，暮春之初，会于会稽山阴之兰亭，修禊事也。此地有崇山峻岭，茂林修竹，又有清流激湍，映带左右，引以为流觞曲水，列坐其次。</p>
  <p>虽无丝竹管弦之盛，一觞一咏，亦足以畅叙幽情。是日也，天朗气清，惠风和畅。仰观宇宙之大，俯察品类之盛，所以游目骋怀，足以极视听之娱，信可乐也。</p>
  <p>夫人之相与，俯仰一世。或取诸怀抱，悟言一室之内；或因寄所托，放浪形骸之外。虽趣舍万殊，静躁不同，当其欣于所遇，暂得于己，快然自足，不知老之将至。</p>
</main>
</body>
</html>
